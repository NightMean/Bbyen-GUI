<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BBYEN</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="BBYEN home"><span class="brand-mark">▶</span> BBYEN</a>
    <span class="top-caption" data-text="caption"></span>
    <button id="theme" class="quiet" type="button" data-text="theme"></button>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <p class="eyebrow" data-text="library"></p>
      <nav aria-label="Library">
        <button id="videos-nav" class="nav active" type="button" data-text="videos"></button>
        <button id="channels-nav" class="nav" type="button" data-text="channels"></button>
        <button id="activity-nav" class="nav" type="button" data-text="activity"></button>
        <button id="settings-nav" class="nav" type="button" data-text="settings"></button>
      </nav>
      <div class="sidebar-note" data-text="libraryNote"></div>
    </aside>
    <main>
      <div class="page-head">
        <div><p class="eyebrow" data-text="yourLibrary"></p><h1 id="heading"></h1></div>
        <div class="head-actions">
          <button id="refresh" class="outline" type="button" data-text="refresh"></button>
          <button id="add" class="primary" type="button" data-text="add"></button>
        </div>
      </div>
      <p id="notice" class="notice" role="status" aria-live="polite"></p>
      <section id="add-panel" class="add-panel" hidden>
        <h2 data-text="addTitle"></h2>
        <p data-text="addHelp"></p>
        <form id="resolve-form"><label for="channel-input" data-text="channelInput"></label>
          <div class="input-row"><input id="channel-input" required maxlength="2048" autocomplete="off">
          <button class="outline" type="submit" data-text="findChannel"></button></div>
        </form>
        <div id="preview" hidden><p><span data-text="resolved"></span> <code id="resolved-id"></code></p>
          <label for="backlog" data-text="backlogLabel"></label>
          <select id="backlog">
            <option value="default" data-text="backlogDefault"></option>
            <option value="none" data-text="backlogNone"></option>
            <option value="all" data-text="backlogAll"></option>
            <option value="newest" data-text="backlogNewest"></option>
          </select>
          <label id="backlog-count-label" hidden><span data-text="backlogCount"></span>
            <input id="backlog-count" type="number" min="1" step="1" value="5">
          </label>
          <button id="confirm-add" class="primary" type="button" data-text="confirmAdd"></button>
        </div>
      </section>
      <div id="toolbar" class="toolbar">
        <label class="search"><span data-text="search"></span><input id="search" type="search" autocomplete="off"></label>
        <div id="dates" class="date-fields">
          <label><span data-text="from"></span><input id="from" type="date"></label>
          <label><span data-text="through"></span><input id="through" type="date"></label>
        </div>
      </div>
      <div id="video-options" class="video-options">
        <div><button id="list-layout" class="outline" type="button" data-text="listView" aria-pressed="true"></button>
          <button id="grid-layout" class="outline" type="button" data-text="gridView" aria-pressed="false"></button></div>
        <label><span data-text="contentType"></span> <select id="content-type"><option value="" data-text="allTypes"></option><option value="livestream" data-text="liveType"></option><option value="unknown" data-text="unknownType"></option></select></label>
        <label><span data-text="playbackSpeed"></span> <select id="playback-speed"><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="2.6">2.6×</option></select></label>
        <span id="watch-time" aria-live="polite"></span>
      </div>
      <p id="filter-label" class="filter-label" hidden></p>
      <section id="settings-panel" hidden>
        <h2 data-text="emailSettings"></h2><p data-text="emailSettingsHelp"></p>
        <form id="email-settings-form" class="settings-form">
          <label><span data-text="smtpHost"></span><input id="smtp-host" required maxlength="253"></label>
          <label><span data-text="smtpPort"></span><input id="smtp-port" type="number" min="1" max="65535" required></label>
          <label class="check"><input id="smtp-secure" type="checkbox"><span data-text="smtpSecure"></span></label>
          <label><span data-text="smtpSender"></span><input id="smtp-sender" required maxlength="512"></label>
          <label><span data-text="smtpDestination"></span><input id="smtp-destination" required maxlength="512"></label>
          <button class="primary" type="submit" data-text="saveEmail"></button>
        </form>
        <div class="email-test"><p data-text="testHelp"></p><button id="test-email" class="outline" type="button" data-text="testEmail"></button><p id="test-email-result" role="status" aria-live="polite"></p></div>
        <h2 data-text="emailCredentials"></h2><p data-text="credentialsHelp"></p>
        <form id="credentials-form" class="settings-form" autocomplete="off">
          <label><span data-text="emailUser"></span><input id="email-user" autocomplete="off" maxlength="512"><small id="user-source"></small></label>
          <label><span data-text="emailPassword"></span><input id="email-password" type="password" autocomplete="new-password" maxlength="4096"><small id="password-source"></small></label>
          <button id="save-credentials" class="outline" type="submit" data-text="saveCredentials"></button>
        </form>
        <h2 data-text="scheduleTitle"></h2><p data-text="scheduleHelp"></p>
        <form id="schedule-form" class="settings-form">
          <label><span data-text="scheduleChannels"></span><input id="schedule-channels" required maxlength="64"></label>
          <label><span data-text="scheduleVideos"></span><input id="schedule-videos" required maxlength="64"></label>
          <button class="outline" type="submit" data-text="saveSchedule"></button>
        </form>
        <h2 data-text="subscriptionTransfer"></h2><p data-text="exportHelp"></p>
        <a class="outline export-link" href="/api/subscriptions/export" download data-text="exportSubscriptions"></a>
        <div class="import-panel">
          <h3 data-text="importSubscriptions"></h3><p data-text="importHelp"></p>
          <label><span data-text="importFile"></span> <input id="import-file" type="file" accept=".json,application/json"></label>
          <button id="import-preview" class="outline" type="button" data-text="previewImport"></button>
          <div id="import-review" hidden>
            <p id="import-summary"></p><pre id="import-details"></pre>
            <label><span data-text="conflictChoice"></span> <select id="import-choice"><option value="keep" data-text="keepExisting"></option><option value="replace" data-text="useImported"></option></select></label>
            <label id="partial-label" class="check" hidden><input id="accept-partial" type="checkbox"><span data-text="acceptPartial"></span></label>
            <button id="import-apply" class="primary" type="button" data-text="applyImport"></button>
          </div>
        </div>
      </section>
      <div id="list-heading" class="list-heading"><span id="list-label"></span><span id="refresh-state"></span></div>
      <section id="results" aria-live="polite"></section>
      <div id="paging" class="paging" hidden>
        <button id="previous" class="outline" type="button" data-text="previous"></button>
        <span id="page-label"></span>
        <button id="next" class="outline" type="button" data-text="next"></button>
      </div>
    </main>
  </div>
</body>
</html>
