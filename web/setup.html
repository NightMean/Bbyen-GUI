<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BBYEN setup</title><link rel="stylesheet" href="/style.css">
  <script defer src="/setup.js"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><span class="brand-mark">▶</span> BBYEN</a></header>
  <main class="setup-page">
    <p class="eyebrow" data-text="setupEyebrow"></p><h1 data-text="setupTitle"></h1>
    <p class="setup-intro" data-text="setupIntro"></p>
    <section class="setup-choice"><h2 data-text="setupManualTitle"></h2>
      <p data-text="setupManualHelp"></p><p id="setup-files"></p>
      <button id="setup-start" class="primary" type="button" disabled data-text="setupStart"></button>
    </section>
    <p class="setup-note" data-text="setupOtherModes"></p>
    <p id="setup-status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
