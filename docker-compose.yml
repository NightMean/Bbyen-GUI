services:
  bbyen:
    image: bbyen:local
    build: .
    container_name: bbyen
    environment:
      CONFIG_DIR: /var/lib/bbyen
    volumes:
      # Mount the directory so atomic file replacements and edit locks work.
      # Set database.filename to /var/lib/bbyen/database.sqlite in config.json.
      - ./data:/var/lib/bbyen
    ports:
      - 3030:3030
      - 3031:3031
    restart: unless-stopped
